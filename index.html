<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TERMINAL // CORSÁRIO CARMESIM</title>
  <style>
    :root {
      --green: #00ff66;
      --green-dim: #008833;
      --red: #ff3333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050d08;
      background-image: linear-gradient(rgba(2, 8, 4, 0.85), rgba(2, 8, 4, 0.85)), url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--green);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Linhas de varredura CRT */
    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    /* Botão de controle de áudio */
    .audio-control {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 20;
    }

    .audio-btn {
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      font-family: inherit;
      font-size: 0.75rem;
      padding: 6px 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .audio-btn:hover {
      background: rgba(0, 255, 102, 0.2);
    }

    .terminal-container {
      width: 100%;
      max-width: 650px;
      background: rgba(2, 6, 3, 0.92);
      border: 2px solid var(--green);
      box-shadow: 0 0 25px rgba(0, 255, 102, 0.25);
      padding: 24px;
      border-radius: 4px;
      position: relative;
      backdrop-filter: blur(4px);
    }

    .header {
      border-bottom: 1px dashed var(--green-dim);
      padding-bottom: 12px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .log-entry {
      background: rgba(0, 255, 102, 0.04);
      border-left: 3px solid var(--green);
      padding: 14px;
      margin-bottom: 24px;
      font-size: 0.95rem;
      line-height: 1.6;
      font-style: italic;
    }

    /* Cursor piscante de terminal */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      background-color: var(--green);
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: #000;
      border: 1px solid var(--green);
      color: var(--green);
      font-family: inherit;
      font-size: 1.2rem;
      padding: 10px;
      outline: none;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 8px var(--green);
    }

    .btn-submit {
      background: var(--green);
      color: #000;
      border: none;
      font-family: inherit;
      font-weight: bold;
      padding: 0 20px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn-submit:hover {
      background: #fff;
      box-shadow: 0 0 10px #fff;
    }

    #status-msg {
      margin-top: 16px;
      min-height: 24px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    .success {
      color: var(--green);
      border: 1px solid var(--green);
      padding: 14px;
      background: rgba(0, 255, 102, 0.1);
      display: none;
      line-height: 1.5;
    }

    .error {
      color: var(--red);
    }
  </style>
</head>
<body onclick="iniciarAudioAutomatico()">

  <!-- Áudio em Loop -->
  <audio id="bg-music" loop preload="auto">
    <source src="theme.mp3" type="audio/mpeg">
  </audio>

  <div class="audio-control">
    <button id="toggle-audio" class="audio-btn" onclick="toggleAudio(event)">[ SOM: OFF ]</button>
  </div>

  <div class="terminal-container">
    <div class="header">
      <div>> CONEXÃO ESTABELECIDA: SUB-FREQUÊNCIA 89.2 MHz</div>
      <div>> STATUS: PROTOCOLO DE EMERGÊNCIA ATIVO</div>
      <div>> DISPOSITIVO: NAVE PIRATA [REGISTRO APAGADO]</div>
    </div>

    <div class="log-entry">
      <span id="typewriter-text"></span><span class="cursor"></span>
    </div>

    <div class="input-section">
      <label for="passcode">> INSIRA A CHAVE DE ACESSO (4 DÍGITOS):</label>
      <div class="input-group">
        <input type="text" id="passcode" maxlength="4" placeholder="____" autocomplete="off">
        <button class="btn-submit" onclick="verificarCodigo()">DECIFRAR</button>
      </div>
      <div id="status-msg"></div>
    </div>

    <div id="success-screen" class="success">
      <p><strong>[ACESSO CONCEDIDO: COFRE DESBLOQUEADO]</strong></p>
      <p style="margin-top: 8px;">> COORDENADAS EXTRAÍDAS: MEGANAUSOBERANA-SETOR-0</p>
      <p>> CARGA: CÓDICES PROIBIDOS DESTINADOS À HARMONIZAÇÃO DE AZATHOTH.</p>
    </div>
  </div>

  <script>
    const mensagemLog = `"Os ângulos deste convés... eles não fecham em 180 graus. A relíquia trancada no cofre canta em quatro frequências:\n\n• I: O número de vértices de uma esfera no vazio.\n• II: O número orbital do asteroide onde selamos o contrato do bar.\n• III: O ciclo de pulso deste reator em colapso.\n• IV: O olho central que tudo observa no abismo."`;

    const elementoTexto = document.getElementById("typewriter-text");
    let indiceCaractere = 0;
    const velocidadeDigitacao = 28;

    function digitarTexto() {
      if (indiceCaractere < mensagemLog.length) {
        const char = mensagemLog.charAt(indiceCaractere);
        
        if (char === '\n') {
          elementoTexto.innerHTML += '<br>';
        } else {
          elementoTexto.innerHTML += char;
        }
        
        indiceCaractere++;
        setTimeout(digitarTexto, velocidadeDigitacao);
      }
    }

    window.addEventListener("DOMContentLoaded", digitarTexto);

    const CODIGO_CORRETO = "0171";
    const audio = document.getElementById('bg-music');
    const audioBtn = document.getElementById('toggle-audio');
    let audioIniciado = false;

    function iniciarAudioAutomatico() {
      if (!audioIniciado) {
        audio.volume = 0.4;
        audio.play().then(() => {
          audioIniciado = true;
          audioBtn.innerText = "[ SOM: ON ]";
        }).catch(() => {});
      }
    }

    function toggleAudio(e) {
      e.stopPropagation();
      if (audio.paused) {
        audio.volume = 0.4;
        audio.play();
        audioBtn.innerText = "[ SOM: ON ]";
        audioIniciado = true;
      } else {
        audio.pause();
        audioBtn.innerText = "[ SOM: OFF ]";
      }
    }

    function verificarCodigo() {
      const input = document.getElementById('passcode').value.trim();
      const status = document.getElementById('status-msg');
      const successScreen = document.getElementById('success-screen');

      if (input === CODIGO_CORRETO) {
        status.innerHTML = "";
        successScreen.style.display = "block";
      } else {
        status.className = "error";
        status.innerText = "> ERRO: CHAVE INCORRETA. ASSINATURA DE FREQUÊNCIA INVÁLIDA.";
      }
    }
  </script>
</body>
</html>
